# Angepasste joint-training configuration für 2D Toy Dataset (MLP)
seed: 1
device: cuda
target_dataset: toycross   # WICHTIG: Ersetze das durch den String, unter dem du die Klasse registrierst
dim: 2                      # Zwingend 2 für das 2D-Dataset

# === ÄNDERUNGEN FÜR DAS MLP ===
hidden_size: 64             # Wieder auf 64 (oder 128) setzen für MLP
hidden_layers: 3            # Wieder auf 3 (oder 4) setzen für MLP
image_shape: null           # Wieder null, da MLPs flache Vektoren erwarten, keine 2D-Bilder
# ================================

time_embedding: sinusoidal
concat_t_emb: true
lr: 0.001
batch_size: 128            # Bei 2D-Toy-Datasets kann man problemlos große Batches (1024) nehmen
epochs: 100000               # Für ein 2D-Modell reichen meist 20.000 bis 50.000 Iterationen völlig
model_grad_clip: 1.0
ema: 0.999
ema_start_step: 0

strat_ot: false 
use_minibatch_ot: true      # minibatch OT for linear FM models
slerp: true
baseline_flow: target_norm_emp # Target-Norm bleibt, um das Sphären-Verhalten zu testen
baseline_latent: gaussian
baseline_flow_T: 1.0
baseline_mmd_b: 1.0
baseline_kac_a: 9.0
baseline_kac_c: 3.0
baseline_kac_epsilon: 1.0e-6
baseline_kac_lookup_M: 5000
baseline_kac_lookup_K: 1024
quantile_checkpoint: null
freeze_quantile: false
eval_step: 50000             # Öfter evaluieren, da das Training viel schneller durchläuft
eval_sample: 10000
eval_batch: 10000
big_eval_samples: 10000
big_eval_step: 50000
num_steps_eval: 100
name: null
mode: fm_and_quantile
q_ntrain: 50000
q_batch: 256
q_u_eps: 1.0e-10
q_lr: 2.0e-4
q_loss_weight: 50.0
quantile_const_iters: 20000
quantile_decay_iters: 5000
q_val_interval: 5000
q_val_samples: 2048
q_ema: 0.99
q_use_ema: true
q_ot_epsilon: 1.0
q_objective: plan_action
lambda_reg: 0.0
metric: ot
q_rqs_bins: 32
q_rqs_bound: 500.0
q_rqs_layers: 3
runs_dir: null
log_wandb: true
wandb_entity: simon161002-technical-university-of-berlin
wandb_group: null
wandb_project: Learn-Noise-2D
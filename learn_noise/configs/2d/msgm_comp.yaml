# Angepasste joint-training configuration für PIV (U-Net)
seed: 1
device: cuda
target_dataset: msgm_piv # override via --override target_dataset=...
dim: 1024

# === ÄNDERUNGEN FÜR DAS U-NET ===
hidden_size: 0              # Vorher 64 -> 0 triggert das U-Net
hidden_layers: 0            # Vorher 3 -> 0 triggert das U-Net
image_shape: [1, 32, 32]    # Vorher null -> Zwingend nötig für Convolutions (1 Kanal, 32x32)
# ================================

time_embedding: sinusoidal
concat_t_emb: true
lr: 0.001                   # Hinweis: Falls das U-Net explodiert (Loss = NaN), setze das auf 0.0002 runter
batch_size: 128
epochs: 100000              # 200000 für heavy tails
model_grad_clip: 1.0
ema: 0.999
ema_start_step: 0

strat_ot: false 
use_minibatch_ot: true     # minibatch OT for linear FM models
slerp: true
baseline_flow: target_norm_emp # linear for linear FM models, target_norm_emp for spherical models
baseline_latent: gaussian
baseline_flow_T: 1.0
baseline_mmd_b: 1.0
baseline_kac_a: 9.0
baseline_kac_c: 3.0
baseline_kac_epsilon: 1.0e-6
baseline_kac_lookup_M: 5000
baseline_kac_lookup_K: 1024
quantile_checkpoint: null
freeze_quantile: false
eval_step: 10000
eval_sample: 20000
eval_batch: 10000
big_eval_samples: 100000
big_eval_step: 50000
num_steps_eval: 100
name: null
mode: fm_and_quantile
q_ntrain: 50000
q_batch: 256
q_u_eps: 1.0e-10
q_lr: 2.0e-4
q_loss_weight: 50.0
quantile_const_iters: 20000
quantile_decay_iters: 5000
q_val_interval: 5000
q_val_samples: 2048
q_ema: 0.99
q_use_ema: true
q_ot_epsilon: 1.0
q_objective: plan_action
lambda_reg: 0.0
metric: ot
q_rqs_bins: 32
q_rqs_bound: 500.0
q_rqs_layers: 3
runs_dir: null
log_wandb: true
wandb_entity: simon161002-technical-university-of-berlin
wandb_group: null
wandb_project: Learn-Noise-2D